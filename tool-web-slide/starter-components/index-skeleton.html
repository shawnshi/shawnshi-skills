<!doctype html>
<html lang="{{LANG}}" data-theme="{{THEME}}" data-aspect="{{ASPECT}}" data-deck-width="{{DECK_WIDTH}}" data-deck-height="{{DECK_HEIGHT}}" data-target-browser="{{TARGET_BROWSER}}" data-target-os="{{TARGET_OS}}" data-delivery-profile="{{DELIVERY_PROFILE}}" data-evidence-policy="{{EVIDENCE_POLICY}}" data-offline-required="{{OFFLINE_REQUIRED}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="web-slide-aspect" content="{{ASPECT}}">
  <title>{{TITLE}}</title>
  <!-- WEB_SLIDE_STYLES -->
</head>
<body class="canvas-mode" data-theme="{{THEME}}" data-aspect="{{ASPECT}}" data-deck-width="{{DECK_WIDTH}}" data-deck-height="{{DECK_HEIGHT}}" data-target-browser="{{TARGET_BROWSER}}" data-target-os="{{TARGET_OS}}" data-delivery-profile="{{DELIVERY_PROFILE}}" data-evidence-policy="{{EVIDENCE_POLICY}}" data-offline-required="{{OFFLINE_REQUIRED}}" data-slide-count="{{SLIDE_COUNT}}">
  <div id="ctrl-bar" aria-label="演示控制栏">
    <div class="ctrl-logo">{{TITLE}}</div>
    <div class="ctrl-actions">
      <span class="ctrl-hint" id="mode-hint">当前：演示模式</span>
      <button class="ctrl-btn" id="btn-doc" type="button">📄 阅读模式</button>
      <button class="ctrl-btn active" id="btn-pres" type="button">▶ 演示模式</button>
      <button class="ctrl-btn" id="btn-fs" type="button" title="全屏">⛶ 全屏</button>
    </div>
  </div>

  <canvas id="bg-grid" class="bg" aria-hidden="true"></canvas>
  <div id="hint">← → 翻页 · B 静态 · ESC 索引</div>

  <main id="deck" aria-label="{{TITLE}}">
    <!-- WEB_SLIDE_SLIDES -->
  </main>
  <nav id="nav" aria-label="幻灯片导航"></nav>

  <!-- WEB_SLIDE_SCRIPTS -->
</body>
</html>
