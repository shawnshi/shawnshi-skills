# .github/workflows/fleet-merge.yml
# Manual approval of one fleet PR/head only. No branch update, close or re-dispatch.
name: Fleet Approved Merge

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Approved base branch"
        type: string
        required: true
        default: "main"
      pr_number:
        description: "Reviewed and approved fleet PR number"
        type: string
        required: true
      head_sha:
        description: "Approved full 40-character lowercase head SHA"
        type: string
        required: true
      task_id:
        description: "Approved task ID in trusted .fleet records"
        type: string
        required: true
      fleet_date:
        description: "Trusted .fleet/YYYY_MM_DD record directory (must exist on default branch)"
        type: string
        required: true
      approved:
        description: "I am authorized to approve this exact repository/base/task/PR/head merge"
        type: boolean
        required: true
        default: false
      dry_run:
        description: "Validate only; do not merge"
        type: boolean
        default: true

# No new write permission is granted by this template. Repository owners must
# separately authorize/configure token merge permissions and protection rules.
concurrency:
  group: fleet-merge
  cancel-in-progress: false

jobs:
  approved-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch (never candidate PR content)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Validate and merge the approved fleet PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLEET_REPO: ${{ github.repository }}
          FLEET_BASE_BRANCH: ${{ inputs.base_branch }}
          FLEET_PR_NUMBER: ${{ inputs.pr_number }}
          FLEET_HEAD_SHA: ${{ inputs.head_sha }}
          FLEET_TASK_ID: ${{ inputs.task_id }}
          FLEET_DATE: ${{ inputs.fleet_date }}
          FLEET_APPROVED: ${{ inputs.approved }}
          FLEET_DRY_RUN: ${{ inputs.dry_run }}
        run: bun scripts/fleet/fleet-merge.ts
