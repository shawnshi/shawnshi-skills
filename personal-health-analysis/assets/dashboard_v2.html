<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>%%TITLE%%</title>
  <style>
    :root { color-scheme: dark; --bg:#0f172a; --panel:#1e293b; --line:#475569; --text:#f8fafc; --muted:#94a3b8; --accent:%%STATUS_COLOR%%; }
    * { box-sizing:border-box; }
    body { margin:0; padding:24px; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { max-width:1280px; margin:auto; display:grid; grid-template-columns:repeat(12,1fr); gap:16px; }
    .panel { grid-column:span 6; min-width:0; padding:20px; border:1px solid #334155; border-radius:12px; background:var(--panel); }
    .hero,.summary { grid-column:span 12; }
    .hero { display:flex; align-items:end; justify-content:space-between; border-left:6px solid var(--accent); }
    h1,h2,p { margin:0; }
    h1 { font-size:24px; }
    h2 { margin-bottom:12px; color:#cbd5e1; font-size:14px; font-weight:650; }
    .eyebrow { color:var(--muted); font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
    .delta { color:#e2e8f0; font-size:36px; font-variant-numeric:tabular-nums; }
    .kpis { grid-column:span 12; display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
    .kpi { padding:14px; border:1px solid #334155; border-radius:10px; background:#172033; }
    .kpi strong { display:block; margin-top:5px; font-size:22px; font-variant-numeric:tabular-nums; }
    .chart { min-height:280px; }
    svg { width:100%; height:auto; min-height:240px; overflow:visible; }
    .axis { stroke:#64748b; stroke-width:1; }
    .grid { stroke:#334155; stroke-width:1; }
    .label { fill:#94a3b8; font-size:10px; }
    .empty { color:var(--muted); padding:80px 0; text-align:center; }
    .summary { white-space:pre-wrap; color:#cbd5e1; }
    .summary p + p { margin-top:12px; }
    .heatmap { display:grid; grid-template-columns:repeat(auto-fit,minmax(82px,1fr)); gap:8px; }
    .heat-cell { min-height:58px; padding:8px; border:1px solid #475569; border-radius:8px; text-align:center; }
    .heat-cell span { display:block; color:#cbd5e1; font-size:11px; }
    @media (max-width:800px) { body{padding:12px}.panel{grid-column:span 12}.kpis{grid-template-columns:repeat(2,1fr)} }
  </style>
</head>
<body>
  <main>
    <section class="panel hero">
      <div><p class="eyebrow">Non-diagnostic wearable trends</p><h1>Garmin 健康趋势</h1></div>
      <div><p class="eyebrow">静息心率相对个人基线差异</p><strong class="delta">%%RHR_DELTA%%%</strong></div>
    </section>
    <section class="kpis" aria-label="最近可用观测">
      <div class="kpi"><span>静息心率</span><strong id="kpi-rhr">--</strong></div>
      <div class="kpi"><span>HRV</span><strong id="kpi-hrv">--</strong></div>
      <div class="kpi"><span>睡眠总时长</span><strong id="kpi-sleep">--</strong></div>
      <div class="kpi"><span>记录压力时长</span><strong id="kpi-stress">%%WEIGHTED_VAL%% h</strong></div>
    </section>
    <section class="panel"><h2>静息心率与 HRV</h2><div id="cardio-chart" class="chart"></div></section>
    <section class="panel"><h2>睡眠阶段与总时长</h2><div id="sleep-chart" class="chart"></div></section>
    <section class="panel"><h2>Body Battery</h2><div id="battery-chart" class="chart"></div></section>
    <section class="panel"><h2>睡眠评分观测</h2><div id="heatmap" class="heatmap"></div></section>
    <section class="panel summary"><h2>趋势说明</h2><div id="summary-text"></div></section>
  </main>
  <script id="health-data" type="application/octet-stream">%%B64_DATA%%</script>
  <script>
  'use strict';
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const palette = ['#60a5fa','#a78bfa','#c4b5fd','#94a3b8'];

  function decodePayload() {
    const encoded = document.getElementById('health-data').textContent.trim();
    try {
      const bytes = Uint8Array.from(atob(encoded), character => character.charCodeAt(0));
      return JSON.parse(new TextDecoder('utf-8').decode(bytes));
    } catch (_error) {
      return {overlay_data:{dates:[]}, heatmap:[], overall_insight:'面板数据无法解析。'};
    }
  }

  function svgNode(name, attributes) {
    const node = document.createElementNS(SVG_NS, name);
    Object.entries(attributes || {}).forEach(([key,value]) => node.setAttribute(key, String(value)));
    return node;
  }

  function setText(id, value, suffix) {
    const node = document.getElementById(id);
    node.textContent = value === null || value === undefined ? '--' : String(value) + (suffix || '');
  }

  function finiteNumber(value) {
    if (typeof value === 'number') return Number.isFinite(value) ? value : null;
    if (typeof value !== 'string' || value.trim() === '') return null;
    const numeric = Number(value);
    return Number.isFinite(numeric) ? numeric : null;
  }

  function lastObserved(values) {
    if (!Array.isArray(values)) return null;
    for (let index=values.length-1; index>=0; index-=1) {
      const numeric = finiteNumber(values[index]);
      if (numeric !== null) return numeric;
    }
    return null;
  }

  function emptyState(container, message) {
    const note = document.createElement('p');
    note.className = 'empty';
    note.textContent = message;
    container.replaceChildren(note);
  }

  function renderLineChart(targetId, dates, definitions) {
    const container = document.getElementById(targetId);
    const observed = definitions.flatMap(definition => (definition.values || []).map(finiteNumber).filter(value => value !== null));
    if (!dates.length || !observed.length) { emptyState(container,'无可绘制观测'); return; }
    const width=760, height=260, left=46, right=16, top=18, bottom=34;
    const min=Math.min(...observed), max=Math.max(...observed), span=max-min || 1;
    const x=index => left + index * (width-left-right) / Math.max(1,dates.length-1);
    const y=value => top + (max-Number(value)) * (height-top-bottom) / span;
    const svg=svgNode('svg',{viewBox:`0 0 ${width} ${height}`,role:'img','aria-label':'按日期排列的可穿戴设备趋势'});
    svg.append(svgNode('line',{x1:left,y1:height-bottom,x2:width-right,y2:height-bottom,class:'axis'}));
    definitions.forEach((definition,seriesIndex) => {
      let segment=[];
      const flush=()=>{ if(segment.length){svg.append(svgNode('polyline',{points:segment.join(' '),fill:'none',stroke:definition.color || palette[seriesIndex%palette.length],'stroke-width':3}));segment=[];} };
      dates.forEach((date,index) => {
        const value=finiteNumber(definition.values && definition.values[index]);
        if (value !== null) segment.push(`${x(index)},${y(value)}`); else flush();
      });
      flush();
    });
    [0,Math.floor((dates.length-1)/2),dates.length-1].filter((value,index,array)=>array.indexOf(value)===index).forEach(index=>{
      const label=svgNode('text',{x:x(index),y:height-10,class:'label','text-anchor':'middle'}); label.textContent=dates[index]; svg.append(label);
    });
    container.replaceChildren(svg);
  }

  function renderSleepChart(overlay) {
    const container=document.getElementById('sleep-chart');
    const dates=overlay.dates || [], deep=overlay.sleep_deep_h || [], rem=overlay.sleep_rem_h || [], light=overlay.sleep_light_h || [], total=overlay.sleep_h || [];
    const stageSums=dates.map((_date,index)=>[deep[index],rem[index],light[index]].reduce((sum,value)=>sum+(finiteNumber(value) ?? 0),0));
    const values=stageSums.concat(total.map(finiteNumber).filter(value=>value !== null));
    if (!dates.length || !values.some(value=>value>0)) { emptyState(container,'无可绘制睡眠阶段观测'); return; }
    const width=760,height=260,left=46,right=16,top=18,bottom=34,max=Math.max(...values,1);
    const band=(width-left-right)/dates.length, bar=Math.max(3,band*.55), y=value=>top+(max-value)*(height-top-bottom)/max;
    const svg=svgNode('svg',{viewBox:`0 0 ${width} ${height}`,role:'img','aria-label':'睡眠阶段堆叠与独立总时长'});
    svg.append(svgNode('line',{x1:left,y1:height-bottom,x2:width-right,y2:height-bottom,class:'axis'}));
    const stages=[{values:deep,color:'#4f46e5'},{values:rem,color:'#8b5cf6'},{values:light,color:'#94a3b8'}];
    dates.forEach((_date,index)=>{
      let accumulated=0;
      stages.forEach(stage=>{
        const numeric=finiteNumber(stage.values[index]);
        if (numeric === null) return;
        const topY=y(accumulated+numeric), bottomY=y(accumulated);
        svg.append(svgNode('rect',{x:left+index*band+(band-bar)/2,y:topY,width:bar,height:Math.max(0,bottomY-topY),fill:stage.color}));
        accumulated+=numeric;
      });
    });
    let totalSegment=[];
    const flush=()=>{if(totalSegment.length){svg.append(svgNode('polyline',{points:totalSegment.join(' '),fill:'none',stroke:'#e2e8f0','stroke-width':2}));totalSegment=[];}};
    dates.forEach((_date,index)=>{const value=finiteNumber(total[index]);if(value !== null){totalSegment.push(`${left+index*band+band/2},${y(value)}`);}else{flush();}}); flush();
    container.replaceChildren(svg);
  }

  function renderHeatmap(items) {
    const container=document.getElementById('heatmap');
    const rows=Array.isArray(items)?items:[];
    if (!rows.length) { emptyState(container,'当前周期未生成睡眠评分观测'); return; }
    const cells=rows.map(item=>{
      const cell=document.createElement('div'); cell.className='heat-cell';
      const score=finiteNumber(item.score);
      cell.style.backgroundColor=score===null?'#1e293b':`rgba(96,165,250,${0.15+Math.max(0,Math.min(100,score))/160})`;
      const date=document.createElement('span'); date.textContent=String(item.date || '');
      const value=document.createElement('strong'); value.textContent=score===null?'—':String(score);
      cell.append(date,value); return cell;
    });
    container.replaceChildren(...cells);
  }

  function renderDashboard() {
    const data=decodePayload(), overlay=data.overlay_data || {dates:[]}, dates=Array.isArray(overlay.dates)?overlay.dates:[];
    setText('kpi-rhr',lastObserved(overlay.rhr),' bpm');
    setText('kpi-hrv',lastObserved(overlay.hrv),' ms');
    setText('kpi-sleep',lastObserved(overlay.sleep_h),' h');
    renderLineChart('cardio-chart',dates,[{values:overlay.rhr,color:'#60a5fa'},{values:overlay.hrv,color:'#a78bfa'}]);
    renderSleepChart(overlay);
    renderLineChart('battery-chart',dates,[{values:overlay.bb_max,color:'#60a5fa'},{values:overlay.bb_min,color:'#94a3b8'}]);
    renderHeatmap(data.heatmap);
    const summary=document.getElementById('summary-text');
    const paragraphs=String(data.overall_insight || '暂无趋势说明。').split(/\n\s*\n/).map(text=>{const node=document.createElement('p');node.textContent=text;return node;});
    summary.replaceChildren(...paragraphs);
  }
  window.addEventListener('DOMContentLoaded',renderDashboard);
  </script>
</body>
</html>
