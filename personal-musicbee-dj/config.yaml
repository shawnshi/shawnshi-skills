# MusicBee DJ runtime configuration

musicbee:
  exe_path: "C:/Program Files (x86)/MusicBee/MusicBee.exe"
  xml_path: "C:/Users/shich/Music/MusicBee/iTunes Music Library.xml"

playlist:
  max_tracks_per_session: 50
  curation:
    anchor_ratio: 0.6
    discovery_ratio: 0.3
    novelty_ratio: 0.1

energy_curves:
  high_intensity_min_bpm: 110
  low_intensity_max_bpm: 100

fallback:
  aliases:
    夜间思考: "focus"
    night thinking: "focus"
    思考: "focus"
    专注: "focus"
    阅读: "focus"
    放松: "relax"
    助眠: "relax"
    运动: "energy"
    健身: "energy"
    家务: "energy"
    study: "focus"
    reading: "focus"
    work: "focus"
    calm: "relax"
    sleep: "relax"
    meditation: "relax"
    housework: "energy"
    chores: "energy"
    workout: "energy"
    gym: "energy"
    daily: "pop"
    casual: "pop"

scenes:
  focus:
    intensity: "low"
    genres: ["Classical", "pure music", "纯音乐", "Ambient", "Jazz"]
    moods: ["neutral", "introspective"]
  relax:
    intensity: "low"
    genres: ["Jazz", "Country", "pure music", "纯音乐", "Ambient"]
    moods: ["warm", "neutral"]
  energy:
    genres: ["Rock", "EDM", "Dance", "Electronic"]
    moods: ["joyful"]
  coding:
    genres: ["pure music", "纯音乐", "Classical", "Ambient", "Jazz"]
  pop:
    genres: ["Pop", "Rock", "R&B", "Soul", "Dance"]

filters:
  high_intensity_exclude: ["ambient", "chill", "intro", "氛围", "纯音乐"]
  low_intensity_exclude: ["metal", "rock", "edm", "金属", "摇滚", "电音"]

# Capability only, not authorization: the caller must verify explicit task scope.
# Playlist handoff requires --allow-tag-completion; read-only modes never dispatch.
tag_completion:
  enabled: true
  library_root: "D:/Music"
  candidate_limit: 100
